# Security headers for Nginx. Include inside the server {} block that serves HTTPS.
# `always` makes the header present on error responses too.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

server_tokens off;

# Hidden files are never served
location ~ /\. { deny all; return 404; }

# Caching
location ~* \.(css|js|webp|jpg|jpeg|png|svg|woff2)$ { add_header Cache-Control "public, max-age=2592000"; }
location ~* \.(html|xml|txt|json)$ { add_header Cache-Control "no-cache"; }

# Note: add_header inside a location block replaces the server-level list.
# Repeat the security headers in those locations, or use a shared include file for them.
